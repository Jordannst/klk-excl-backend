# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - klkinvoice

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: klk_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klk_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klk_test
      JWT_SECRET: local-ci-only
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build

      - name: Verify migrations against the Prisma schema
        run: |
          npx --no-install prisma migrate deploy
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Run checks
        run: |
          npm test
          npm prune --omit=dev --omit=optional --ignore-scripts
          test -f dist/generated/prisma/client.js
          test ! -d node_modules/prisma
          npm run test:integration

      - name: Package sources for the Azure build
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/klk-webapp.zip" "$GITHUB_SHA" -- \
            src prisma prisma.config.ts package.json package-lock.json tsconfig.json

      - name: Build and start the release ZIP as Azure does
        shell: bash
        env:
          NODE_ENV: production
          PORT: 4100
        run: |
          cd "$(mktemp -d "$RUNNER_TEMP/klk-smoke.XXXXXX")"
          unzip -q "$RUNNER_TEMP/klk-webapp.zip"
          test ! -e node_modules
          test ! -e dist
          test ! -e src/generated/prisma
          npm install
          npm run build
          node dist/checks/postgres-connection.check.js
          node dist/checks/pdf-service.check.js
          npm start &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          verifier="$GITHUB_WORKSPACE/.github/scripts/verify-release.mjs"
          health_url="http://127.0.0.1:$PORT/api/health"
          node "$verifier" "$health_url" "$GITHUB_SHA" 60

          # A healthy process serving a different commit must exhaust the deadline.
          other_commit=0000000000000000000000000000000000000000
          if node "$verifier" "$health_url" "$other_commit" 3 > mismatch.log 2>&1; then
            echo "The release check accepted the wrong commit" >&2
            exit 1
          else
            result=$?
          fi
          cat mismatch.log
          test "$result" -eq 1
          grep -Fq "Timed out waiting for $other_commit. Last result: HTTP 200 commit=$GITHUB_SHA db=up" mismatch.log

      - name: Upload artifact for deployment job
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: ${{ runner.temp }}/klk-webapp.zip
          compression-level: 0
          if-no-files-found: error

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1E481A216A5749BAA7231AD998327A4C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B7F95496F8D45DF8A0AEF20C8B9C243 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD89D82C798C4EE2B6D0B5F204B7A147 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'klkinvoice'
          slot-name: 'Production'
          package: klk-webapp.zip

      - name: Verify database health after deployment
        env:
          WEBAPP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: node .github/scripts/verify-release.mjs "${WEBAPP_URL%/}/api/health" "$GITHUB_SHA" 300
